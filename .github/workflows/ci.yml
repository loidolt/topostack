name: CI and Worker Deploy

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13"
  DEVELOPMENT_URL: https://dev.topostack.app
  PRODUCTION_URL: https://topostack.app

jobs:
  # Lint/typecheck and tests run in parallel; deploy-worker needs both.
  lint-typecheck:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: lint-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    env:
      VITE_MAP_API_URL: https://ci.invalid
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js and dependencies
        uses: ./.github/actions/setup-node-deps

      - name: Check release version consistency
        run: npm run version:check

      - name: Check the changelog agrees with the release version
        run: npm run changelog:verify

      # Deploys are gated only on high-severity advisories in runtime
      # dependencies; the full audit runs non-blocking in dependency-audit.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Verify generated Worker types
        run: npm run types:check -w @topostack/map-api

      - name: Lint
        run: npm run lint

      - name: No unused exports
        run: npm run lint:exports

      - name: Typecheck
        run: npm run typecheck

  tests:
    name: Tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: tests-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    env:
      VITE_MAP_API_URL: https://ci.invalid
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js and dependencies
        uses: ./.github/actions/setup-node-deps

      - name: Test provisioning and lifecycle safeguards
        run: npm run test:scripts

      - name: Test unit and component suites with coverage thresholds
        run: npm run test:coverage

  # Informational: reports moderate advisories in every dependency, including
  # dev tooling, without blocking deploys. Not listed in deploy-worker needs.
  dependency-audit:
    name: Full dependency audit (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    concurrency:
      group: audit-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: ./.github/actions/setup-node-deps
        with:
          install: "false"

      - name: Audit all dependencies
        run: npm audit --audit-level=moderate

  python-data-tools:
    name: Python data tooling tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: python-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: scripts/data-build/requirements.txt

      # requirements.txt pins a superset of the NOAA and terrain builder
      # dependencies (numpy, rasterio, Pillow, fiona, scipy, shapely).
      - name: Install pinned builder dependencies
        run: python -m pip install -r scripts/data-build/requirements.txt

      - name: Lint Python builders
        run: pipx run ruff==0.14.0 check scripts

      - name: Test bathymetry, terrain, and lake outline builders
        # Same command developers run locally; package.json is the single source.
        run: npm run test:python

  build-and-budget:
    name: Build and budget
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: build-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    env:
      VITE_MAP_API_URL: https://ci.invalid
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js and dependencies
        uses: ./.github/actions/setup-node-deps

      - name: Build
        run: npm run build
        env:
          VITE_SITE_ENV: production

      - name: Verify production search metadata
        run: node scripts/verify/verify-seo.mjs --environment production

      - name: Enforce web performance budgets
        run: npm run budget:web

      - name: Enforce the Worker bundle budget and geometry-free imports
        run: npm run budget:worker

      # This build intentionally embeds the hermetic https://ci.invalid
      # sentinel, which the endpoint scan would reject. Packaging and release
      # runs always execute the full endpoint scan.
      - name: Verify Atomm static artifact
        run: node scripts/verify/verify-atomm-dist.mjs --skip-endpoint-scan

      - name: Verify development indexing exclusion
        run: |
          npm run build -w @topostack/generator
          node scripts/verify/verify-seo.mjs --environment development
        env:
          VITE_SITE_ENV: development

      # The release package is built only on main, where a broken Atomm build
      # would surface after the release is cut. Build it on every run instead.
      - name: Verify Atomm package build
        run: |
          npm run build -w @topostack/generator
          node scripts/verify/verify-atomm-dist.mjs --require-sdk-entry --skip-endpoint-scan
        env:
          VITE_SITE_ENV: atomm

  # One E2E build for all nine browser shards; each used to build its own.
  e2e-build:
    name: Build the E2E app
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: e2e-build-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    env:
      VITE_MAP_API_URL: https://ci.invalid
      # The deterministic terrain fixture needs both, as in playwright.config.ts.
      VITE_E2E: "1"
      VITE_SITE_ENV: production
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js and dependencies
        uses: ./.github/actions/setup-node-deps

      - name: Build in the E2E mode
        run: npm run build:e2e -w @topostack/generator

      # `vite preview` serves SvelteKit's .svelte-kit/output; dist holds the
      # post-processed static files. Both are needed, and .svelte-kit is hidden.
      # Named by run only: re-running just the failed shards skips this job,
      # and those shards must still find the build an earlier attempt made.
      - name: Upload the build for the browser shards
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-build-${{ github.run_id }}
          overwrite: true
          path: |
            apps/generator/.svelte-kit/output
            apps/generator/dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  browser-tests:
    name: Browser E2E (${{ matrix.browser }}, shard ${{ matrix.shard }}/3)
    needs: e2e-build
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        # Separate runners keep WebGL tests serial without exceeding the job limit.
        shard: [1, 2, 3]
    runs-on: ubuntu-latest
    # Playwright shards by test count, not duration, so the Atomm workbench
    # specs all land in shard 1: on Chromium that shard took 9-15 minutes
    # (about 4 of setup and the E2E build, up to 11 of tests) against 4-9 for
    # the rest, and at 15 a run whose 29 tests had all passed was cancelled.
    timeout-minutes: 25
    concurrency:
      group: browser-${{ matrix.browser }}-${{ matrix.shard }}-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    env:
      VITE_MAP_API_URL: https://ci.invalid
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js and dependencies
        uses: ./.github/actions/setup-node-deps

      - name: Resolve Playwright version
        id: playwright
        run: |
          echo "version=$(node -p "require('./package-lock.json').packages['node_modules/playwright'].version")" >> "$GITHUB_OUTPUT"
          echo "image=$ImageOS" >> "$GITHUB_OUTPUT"

      # Browser binaries are versioned with Playwright; a cache hit still
      # installs the system libraries they need.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-${{ matrix.browser }}

      # Those libraries come from Ubuntu's mirror, which at times serves a few
      # KB/s: WebKit's couple of hundred packages once took a shard past its
      # time limit before any test ran. Keep the downloaded packages and give
      # them back to apt, so a run downloads only what changed since. The key
      # follows the image's OS and Playwright, which pins what install-deps asks for.
      - name: Cache browser system packages
        id: system-packages-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/system-packages
          key: system-packages-${{ runner.os }}-${{ steps.playwright.outputs.image }}-${{ steps.playwright.outputs.version }}-${{ matrix.browser }}

      # A stalled Ubuntu mirror once held apt-get update until the job's 25
      # minutes ran out. Connections now time out and retry, and the whole
      # install gets three bounded attempts.
      - name: Restore browser system packages to apt
        run: |
          echo 'APT::Keep-Downloaded-Packages "true";' | sudo tee /etc/apt/apt.conf.d/99keep-downloaded-packages > /dev/null
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' | sudo tee /etc/apt/apt.conf.d/99network-timeouts > /dev/null
          if [ -d ~/system-packages ]; then sudo find ~/system-packages -name '*.deb' -exec cp -t /var/cache/apt/archives/ {} +; fi

      - name: Install browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: for attempt in 1 2 3; do timeout 420 npx playwright install --with-deps ${{ matrix.browser }} && exit 0; echo "Browser install attempt $attempt failed."; sudo pkill -f apt-get || true; done; exit 1

      - name: Install browser system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: for attempt in 1 2 3; do timeout 300 npx playwright install-deps ${{ matrix.browser }} && exit 0; echo "System dependency install attempt $attempt failed."; sudo pkill -f apt-get || true; done; exit 1

      - name: Keep browser system packages for the cache
        if: steps.system-packages-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/system-packages
          find /var/cache/apt/archives -maxdepth 1 -name '*.deb' -exec cp -t ~/system-packages/ {} +
          echo "Cached $(find ~/system-packages -name '*.deb' | wc -l) packages ($(du -sh ~/system-packages | cut -f1))."

      - name: Download the E2E build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-build-${{ github.run_id }}
          path: apps/generator

      - name: Test browser generation and export
        run: xvfb-run --auto-servernum npm run test:e2e -- --project=${{ matrix.browser }} --shard=${{ matrix.shard }}/3
        env:
          E2E_PREBUILT: "1"

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-diagnostics-${{ matrix.browser }}-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

  # Keep the existing required check name; every browser shard must pass.
  browser-e2e:
    name: Browser E2E
    needs: browser-tests
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every browser to pass
        env:
          BROWSER_RESULT: ${{ needs.browser-tests.result }}
        run: test "$BROWSER_RESULT" = success

  deploy-worker:
    name: Deploy Worker
    needs: [lint-typecheck, tests, python-data-tools, build-and-budget, browser-e2e]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref_name == 'dev' || github.ref_name == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'development' }}
      url: ${{ github.ref_name == 'main' && env.PRODUCTION_URL || env.DEVELOPMENT_URL }}
    concurrency:
      group: map-api-${{ github.ref_name == 'main' && 'production' || 'development' }}
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js and dependencies
        uses: ./.github/actions/setup-node-deps

      - name: Build frontend for same-origin deployment
        run: npm run build -w @topostack/generator
        env:
          VITE_SITE_ENV: ${{ github.ref_name == 'main' && 'production' || 'development' }}

      - name: Verify search indexing policy
        run: node scripts/verify/verify-seo.mjs --environment ${{ github.ref_name == 'main' && 'production' || 'development' }}

      # build-and-budget checks a hermetic https://ci.invalid build, but this job
      # deploys a different same-origin build (no VITE_MAP_API_URL, per-branch
      # VITE_SITE_ENV). Re-check the exact files being deployed before wrangler
      # uploads them. No sentinel is embedded, so the full endpoint scan runs.
      - name: Enforce web performance budgets on deployed build
        run: npm run budget:web

      - name: Verify deployed static artifact
        run: node scripts/verify/verify-atomm-dist.mjs

      - name: Verify pinned lake outlines are provisioned
        run: node scripts/provision/fetch-lake-outlines.mjs ${{ github.ref_name == 'main' && '--prod' || '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify staged production FAA archive before deploy
        if: github.ref_name == 'main'
        run: node scripts/provision/activate-aviation-release.mjs --prod --verify-only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Deploy with the wrangler the lockfile pins, the one every build and
      # dry run in CI used, rather than a second hand-maintained version.
      - name: Resolve wrangler version
        id: wrangler
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/wrangler'].version")" >> "$GITHUB_OUTPUT"

      - name: Deploy app, map API, and synchronize Worker secrets
        id: deploy
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/map-api
          wranglerVersion: ${{ steps.wrangler.outputs.version }}
          environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}
          command: deploy --env ${{ github.ref_name == 'main' && 'production' || 'development' }}
          secrets: |
            GEOCODER_API_KEY
            FEEDBACK_EMAIL_TO
        env:
          GEOCODER_API_KEY: ${{ secrets.GEOCODER_API_KEY }}
          FEEDBACK_EMAIL_TO: ${{ secrets.FEEDBACK_EMAIL_TO }}

      - name: Activate the FAA archive matching the deployed registration
        if: github.ref_name == 'main'
        run: node scripts/provision/activate-aviation-release.mjs --prod --promote --receipt="$RUNNER_TEMP/aviation-activation.json"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Retain FAA activation and rollback receipt
        if: always() && github.ref_name == 'main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: aviation-activation-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/aviation-activation.json
          if-no-files-found: ignore
          retention-days: 90

      - name: Smoke test deployed Worker
        run: node scripts/verify/verify-worker-deployment.mjs
        env:
          # Allow the previous Worker version's routes/origin policy to settle.
          DEPLOYMENT_ROLLOUT: "1"
          WORKER_URL: ${{ steps.deploy.outputs.deployment-url }}
          PUBLIC_APP_URL: ${{ github.ref_name == 'main' && env.PRODUCTION_URL || env.DEVELOPMENT_URL }}
          EXPECTED_WORKER_ENVIRONMENT: ${{ github.ref_name == 'main' && 'production' || 'development' }}

      # Split out of the smoke test so the hourly production monitor can run
      # that file without installing jsdom. Static assets can lag the Worker,
      # so this one keeps the propagation retry window.
      - name: Verify deployed search metadata over HTTP
        run: node scripts/verify/verify-seo-http.mjs "$PUBLIC_APP_URL" "$EXPECTED_WORKER_ENVIRONMENT"
        env:
          PUBLIC_APP_URL: ${{ github.ref_name == 'main' && env.PRODUCTION_URL || env.DEVELOPMENT_URL }}
          EXPECTED_WORKER_ENVIRONMENT: ${{ github.ref_name == 'main' && 'production' || 'development' }}
          SEO_PROPAGATION_TIMEOUT_MS: "180000"

  # A dev -> main promotion carries a "Release vX.Y.Z" commit from
  # release-prepare.yml. Once production is deployed, tag that version and
  # publish its GitHub release from the changelog. Reruns and promotions that
  # did not bump the version find the tag and do nothing. The release is not
  # marked Latest: that stays on the Atomm release (release-atomm.yml), whose
  # assets are what people download.
  tag-release:
    name: Tag release
    needs: deploy-worker
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: tag-release
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js and dependencies
        uses: ./.github/actions/setup-node-deps

      - name: Tag and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "v$VERSION is already tagged."
            exit 0
          fi
          npm run --silent changelog:notes -- "$VERSION" > "$RUNNER_TEMP/notes.md"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" "$GITHUB_SHA" -m "TopoStack $VERSION"
          git push origin "v$VERSION"
          gh release create "v$VERSION" --verify-tag --title "TopoStack $VERSION" --notes-file "$RUNNER_TEMP/notes.md" --latest=false

  package-atomm:
    name: Package Atomm release
    needs: deploy-worker
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: atomm-release-production
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js and dependencies
        uses: ./.github/actions/setup-node-deps

      - name: Build production Atomm release
        run: npm run release:atomm && npm run package:atomm-listing
        env:
          VITE_MAP_API_URL: ${{ env.PRODUCTION_URL }}
          VITE_SITE_ENV: atomm

      - name: Resolve versioned Atomm filenames
        id: atomm-files
        run: |
          node --input-type=module <<'JS'
          import { appendFile } from "node:fs/promises";
          import { readVersions } from "./scripts/release/versions.mjs";
          import { atommReleaseFiles } from "./scripts/lib/atomm-release-files.mjs";
          const files = atommReleaseFiles((await readVersions()).atommVersion);
          await appendFile(process.env.GITHUB_OUTPUT, Object.entries(files).map(([key, value]) => `${key}=${value}\n`).join(""));
          JS

      - name: Upload production Atomm release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: topostack-atomm-${{ github.sha }}
          path: |
            apps/generator/${{ steps.atomm-files.outputs.archive }}
            apps/generator/${{ steps.atomm-files.outputs.checksum }}
            apps/generator/${{ steps.atomm-files.outputs.receipt }}
            atomm/${{ steps.atomm-files.outputs.listing }}
          if-no-files-found: error
          retention-days: 30
