name: CI and Worker Deploy

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_MAP_API_URL: https://ci.invalid
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify generated Worker types
        run: npm run types:check -w @topostack/map-api

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Install browser for end-to-end tests
        run: npx playwright install --with-deps chromium

      - name: Test browser generation and export
        run: npm run test:e2e

      - name: Build
        run: npm run build

      - name: Verify Atomm static artifact
        run: node scripts/verify-atomm-dist.mjs

  deploy-worker:
    name: Deploy Worker
    needs: validate
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref_name == 'dev' || github.ref_name == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    concurrency:
      group: map-api-${{ github.ref_name == 'main' && 'production' || 'development' }}
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend for same-origin deployment
        run: npm run build -w @topostack/generator

      - name: Deploy app, map API, and synchronize Worker secrets
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/map-api
          wranglerVersion: "4.124.0"
          environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}
          command: deploy --env ${{ github.ref_name == 'main' && 'production' || 'development' }}
          secrets: |
            GEOCODER_API_KEY
        env:
          GEOCODER_API_KEY: ${{ secrets.GEOCODER_API_KEY }}

      - name: Smoke test deployed Worker
        run: node scripts/verify-worker-deployment.mjs
        env:
          WORKER_URL: ${{ steps.deploy.outputs.deployment-url }}
          PUBLIC_APP_URL: ${{ github.ref_name == 'main' && 'https://topostack.loidolt.space' || steps.deploy.outputs.deployment-url }}
          EXPECTED_WORKER_ENVIRONMENT: ${{ github.ref_name == 'main' && 'production' || 'development' }}

      - name: Build production Atomm release
        if: github.ref_name == 'main'
        run: npm run release:atomm
        env:
          VITE_MAP_API_URL: https://topostack.loidolt.space

      - name: Upload production Atomm release
        if: github.ref_name == 'main'
        uses: actions/upload-artifact@v7
        with:
          name: topostack-atomm-${{ github.sha }}
          path: |
            apps/generator/topostack-atomm.zip
            apps/generator/topostack-atomm.zip.sha256
            atomm/assets/topostack-cover.png
            atomm/listing.md
          if-no-files-found: error
          retention-days: 30
