name: CI and Worker Deploy

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "22.22.2"
  DEVELOPMENT_URL: https://dev-topostack.echofoxtrot.works
  PRODUCTION_URL: https://topostack.echofoxtrot.works

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: quality-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    env:
      VITE_MAP_API_URL: https://ci.invalid
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production and build dependencies
        run: npm audit --audit-level=moderate

      - name: Verify generated Worker types
        run: npm run types:check -w @topostack/map-api

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test unit and component suites with coverage thresholds
        run: npm run test:coverage

  build-and-budget:
    name: Build and budget
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: build-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    env:
      VITE_MAP_API_URL: https://ci.invalid
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Enforce web performance budgets
        run: npm run budget:web

      # This build intentionally embeds the hermetic https://ci.invalid
      # sentinel, which the endpoint scan would reject. Packaging and release
      # runs always execute the full endpoint scan.
      - name: Verify Atomm static artifact
        run: node scripts/verify-atomm-dist.mjs --skip-endpoint-scan

  browser-e2e:
    name: Browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: browser-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    env:
      VITE_MAP_API_URL: https://ci.invalid
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Test browser generation and export
        run: xvfb-run --auto-servernum npm run test:e2e

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

  deploy-worker:
    name: Deploy Worker
    needs: [quality, build-and-budget, browser-e2e]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref_name == 'dev' || github.ref_name == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'development' }}
      url: ${{ github.ref_name == 'main' && env.PRODUCTION_URL || env.DEVELOPMENT_URL }}
    concurrency:
      group: map-api-${{ github.ref_name == 'main' && 'production' || 'development' }}
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend for same-origin deployment
        run: npm run build -w @topostack/generator

      - name: Deploy app, map API, and synchronize Worker secrets
        id: deploy
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/map-api
          wranglerVersion: "4.131.1"
          environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}
          command: deploy --env ${{ github.ref_name == 'main' && 'production' || 'development' }}
          secrets: |
            GEOCODER_API_KEY
        env:
          GEOCODER_API_KEY: ${{ secrets.GEOCODER_API_KEY }}

      - name: Smoke test deployed Worker
        run: node scripts/verify-worker-deployment.mjs
        env:
          WORKER_URL: ${{ steps.deploy.outputs.deployment-url }}
          PUBLIC_APP_URL: ${{ github.ref_name == 'main' && env.PRODUCTION_URL || env.DEVELOPMENT_URL }}
          EXPECTED_WORKER_ENVIRONMENT: ${{ github.ref_name == 'main' && 'production' || 'development' }}

  package-atomm:
    name: Package Atomm release
    needs: deploy-worker
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: atomm-release-production
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production Atomm release
        run: npm run release:atomm
        env:
          VITE_MAP_API_URL: ${{ env.PRODUCTION_URL }}

      - name: Upload production Atomm release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: topostack-atomm-${{ github.sha }}
          path: |
            apps/generator/topostack-atomm.zip
            apps/generator/topostack-atomm.zip.sha256
            apps/generator/topostack-atomm.release.json
            atomm/assets/topostack-cover.png
            atomm/listing.md
          if-no-files-found: error
          retention-days: 30
