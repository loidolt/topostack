name: CI and Worker Deploy

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_MAP_API_URL: https://ci.invalid
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify generated Worker types
        run: npm run types:check -w @topostack/map-api

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify Atomm static artifact
        run: node scripts/verify-atomm-dist.mjs

  deploy-worker:
    name: Deploy Worker
    needs: validate
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref_name == 'dev' || github.ref_name == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    concurrency:
      group: map-api-${{ github.ref_name == 'main' && 'production' || 'development' }}
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy map API and synchronize Worker secrets
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/map-api
          wranglerVersion: "4.124.0"
          environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}
          command: deploy --env ${{ github.ref_name == 'main' && 'production' || 'development' }}
          secrets: |
            GEOCODER_API_KEY
        env:
          GEOCODER_API_KEY: ${{ secrets.GEOCODER_API_KEY }}

      - name: Smoke test deployed Worker
        run: node scripts/verify-worker-deployment.mjs
        env:
          WORKER_URL: ${{ steps.deploy.outputs.deployment-url }}
          EXPECTED_WORKER_ENVIRONMENT: ${{ github.ref_name == 'main' && 'production' || 'development' }}
