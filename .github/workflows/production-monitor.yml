name: Production Monitor

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-monitor
  cancel-in-progress: false

jobs:
  canary:
    name: Production canary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.22.2"

      - name: Verify production frontend, API, and data providers
        run: node scripts/verify-worker-deployment.mjs
        env:
          WORKER_URL: https://topostack.echofoxtrot.works
          PUBLIC_APP_URL: https://topostack.echofoxtrot.works
          EXPECTED_WORKER_ENVIRONMENT: production
