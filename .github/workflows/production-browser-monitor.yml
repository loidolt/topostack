name: Production Browser Monitor

on:
  schedule:
    - cron: "37 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-browser-monitor
  cancel-in-progress: false

jobs:
  browser-canary:
    name: Live generation canary
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.22.2"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Generate terrain in production
        run: npm run test:e2e:live
        env:
          PUBLIC_APP_URL: https://topostack.echofoxtrot.works

      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: production-browser-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results-live
          if-no-files-found: ignore
          retention-days: 7
